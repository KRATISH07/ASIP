services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: asip-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    rootDir: .
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: OPENAI_API_KEY
        sync: false          # paste your key in dashboard
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CHROMA_HOST
        value: localhost     # ChromaDB not deployed — agents use rule-based fallback
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
    healthCheckPath: /health
    autoDeploy: true
